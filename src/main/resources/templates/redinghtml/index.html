<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"  rel="stylesheet">
  <style>.err {color:red}</style>
  <title th:text="${title}"></title>
</head>
<body>
  <!-- 読書記録----------------------------------------------------------------------------------------------------------------- -->
  <div class="container mt-4">
    <h2 class="mb-4" th:text="${title}"></h2>
    <table class="table table-striped table-bordered align-middle text-center">
      <thead>
        <tr>
          <th>作品名</th>
          <th>著者名</th>
          <th>読了日</th>
          <th>メモ</th>
          <th>評価</th>
          <th>操作</th>
        </tr>
      </thead>

      <tbody>
        <tr th:each="item :${data}">
          <td th:text="${item.work.title}"></td>
          <td th:text="${item.work.author.name}"></td>
          <td th:text="${item.finishedDate}"></td>
          <td th:text="${item.memo}"></td>
          <td th:text="${item.rating}"></td>
          <td>
            <form th:action="@{/rdedit/{id}(id=${id})}" method="get" class="d-inline">
              <input type="hidden" name="id" th:value="id">
              <button type="submit">修正</button>
            </form>
            <form th:action="@{/deletelog/{id}(id=${item.id})}" method="get" class="d-inline">
              <input type="hidden" name="id" th:value="${item.id}">
              <button type="submit">削除</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- 読了form--------------------------------------------------------------------------------------------------------------- -->
  <div class="container mt-4">
    <h2 th:text="${add}"></h2>

    <form th:action="@{/readingMng}" method="post" th:object="${formModel}">
      <ul>
        <li th:each="error : ${#fields.detailedErrors()}" class="text table-bordered" th:text="${error.message}"></li>
      </ul>
      <div class="mb-3 d-flex align-items-center">
        <label for="title" class="form-label me-3 mb-0">作品名：</label>
        <select class="form-select w-auto" th:field="*{work.id}">
          <option value="">-- 選択してください --</option>
          <option th:each="item : ${wklist}" th:value="${item.id}" th:text="|${item.title} （著：${item.author.name}）|"></option>
        </select>
      </div>
      <div class="mb-3 d-flex align-items-center">
        <label for="finished_date" class="form-label me-3 mb-0">読了日：</label>
        <input type="date" class="w-auto" th:field="*{finishedDate}" th:errorclass="err">
        <div th:if="${#fields.hasErrors('finishedDate')}" th:errors="*{finishedDate}" th:errorclass="err"></div>
      </div>
      <div class="mb-3 d-flex align-items-center">
        <label for="memo" class="form-label me-3 mb-0">メモ：</label>
        <input type="text" class="w-auto" th:field="*{memo}">
      </div>
      <div class="mb-3 d-flex align-items-center">
        <label for="rating" class="form-label me-3 mb-0">評価(1~5)：</label>
        <select class="form-select w-auto" th:field="*{rating}">
          <option value="">-- 選択してください --</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>
      <button class="mt-2 mb-2" type="submit">登録</button>
    </form>
  </div>

  <!-- 補助機能----------------------------------------------------------------------------------------------------------- -->
  <div class="container mt-4">
    <h2 th:text="${Assistance}"></h2>

    <form th:action="@{/addAuthor}" method="get" class="d-inline">
      <button type="submit">著者追加</button>
    </form>
    <form th:action="@{/rdauthor}" method="get" class="d-inline">
      <button type="submit">作品検索</button>
    </form>
  </div>
</body>
</html>
