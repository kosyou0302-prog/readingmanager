<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"  rel="stylesheet">
  <style>.err {color:red}</style>
  <title th:text="${title}"></title>
</head>
<body  class="container mt-4">
  <h2 th:text="${title}"></h2>

  <form th:action="@{/addAuthor}" method="post" th:object="${formModel}">

    <div>
      <label for="name" class="form-label me-3 mb-0">著者名：</label>
      <input type="text" class="form-control" th:field="*{name}">
    </div>

    <div>
      <label for="birth" class="form-label">生年月日：</label>
      <input type="date" class="form-control" th:field="*{birth}">
    </div>

    <div>
      <label for="death" class="form-label">没年月日：</label>
      <input type="date" class="form-control" th:field="*{death}">
    </div>
    <button class="mt-2 mb-2" type="submit">登録</button>
  </form>

  <form th:action="@{/readingMng}" method="get" class="d-inline">
    <button type="submit" class="btn btn-secondary">戻る</button>
  </form>

</body>
</html>
