<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"  rel="stylesheet">
  <style>.err {color:red}</style>
  <title th:text="${title}"></title>
</head>
<body  class="container mt-4">
  <h2 th:text="${title}"></h2>

  <form th:action="@{/edit}" method="post" th:object="${formModel}">
    <input type="hidden" th:field="*{id}">

    <div class="mb-3 d-flex align-items-center">
        <label for="title" class="form-label me-3 mb-0">作品名：</label>
        <select class="form-select w-auto" th:field="*{work.id}">
          <option th:each="item : ${wklist}" th:value="${item.id}" th:text="|${item.title} （著：${item.author.name}）|"></option>
        </select>
      </div>

    <div class="mb-3 d-flex align-items-center">
      <label for="birth" class="form-label me-3 mb-0">読了日：</label>
      <input type="date" class="form-control" th:field="*{finishedDate}">
      <div th:if="${#fields.hasErrors('finishedDate')}" th:errors="*{finishedDate}" th:errorclass="err"></div>
    </div>

    <div class="mb-3 d-flex align-items-center">
      <label for="death" class="form-label me-3 mb-0">メモ：</label>
      <input type="text" class="form-control" th:field="*{memo}">
      <div th:if="${#fields.hasErrors('memo')}" th:errors="*{memo}" th:errorclass="err"></div>
    </div>

    <div class="mb-3 d-flex align-items-center">
        <label for="rating" class="form-label me-3 mb-0">評価(1~5)：</label>
        <select class="form-select w-auto" th:field="*{rating}">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>
    <button class="mt-2 mb-2" type="submit">登録</button>
  </form>

  <form th:action="@{/readingMng}" method="get" class="d-inline">
    <button type="submit" class="btn btn-secondary">戻る</button>
  </form>

</body>
</html>
